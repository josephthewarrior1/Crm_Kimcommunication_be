name: crm-kimtele
version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: crm-kimtele-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm_kimtele}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crmpostgres2025}
    ports:
      - "4000:5432"
    volumes:
      - crm_kimtele_postgres_data:/var/lib/postgresql/data
    networks:
      - crm-kimtele
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-kimtele-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8085}:8081"
    env_file:
      - .env
    environment:
      - SERVER_PORT=8081
      - SPRING_PROFILES_ACTIVE=postgres
      - JDBC_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-crm_kimtele}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-crm_kimtele}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-crmpostgres2025}
      - APP_CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:8082,http://127.0.0.1:8082,http://localhost:8084,http://127.0.0.1:8084
      - EMS_API_URL=${EMS_API_URL:-https://api.admin.event.kimcommunication.com}
      - EMS_ADMIN_EMAIL=${EMS_ADMIN_EMAIL:-admin_staff@kim-marketing.com}
      - EMS_ADMIN_PASSWORD=${EMS_ADMIN_PASSWORD:-!QAZkim123}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crm-kimtele

networks:
  crm-kimtele:
    driver: bridge

volumes:
  crm_kimtele_postgres_data:
