# Explicit, isolated local profile. Never use the default postgres profile for this preview.
server.address=127.0.0.1
server.port=8186
spring.datasource.url=jdbc:postgresql://127.0.0.1:55433/tagtog_crm
spring.datasource.driver-class-name=org.postgresql.Driver
# Supply SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD externally.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-tagtog-local.yaml
app.data.seed=false
app.admin.bootstrap=false
ems.integration.enabled=false
EMS_API_URL=http://127.0.0.1:9
EMS_ADMIN_EMAIL=
EMS_ADMIN_PASSWORD=
app.cors.allowed-origins=http://127.0.0.1:8188,http://127.0.0.1:4180
tagtog.sso.enabled=${TAGTOG_SSO_ENABLED:true}
tagtog.sso.iam-base-url=${TAGTOG_IAM_BASE_URL:http://127.0.0.1:8181}
tagtog.sso.issuer=${TAGTOG_IAM_ISSUER:http://127.0.0.1:8181}
tagtog.sso.client-id=${TAGTOG_SSO_CLIENT_ID:crm-local}
tagtog.sso.client-secret=${TAGTOG_SSO_CLIENT_SECRET:}
tagtog.sso.redirect-uri=${TAGTOG_SSO_REDIRECT_URI:http://127.0.0.1:8188/api/tagtog/callback}
